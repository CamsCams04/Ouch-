<svg width="400" height="400" viewBox="0 0 400 400" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="400" height="400" fill="#1A1A1A" rx="40"/>
  
  <!-- Explosion burst -->
  <polygon 
    points="200,30 218,95 275,55 248,115 310,105 265,155 320,180 262,192 300,245 240,238 248,300 200,268 152,300 160,238 100,245 138,192 80,180 135,155 90,105 152,115 125,55 182,95"
    fill="#FF5733" opacity="0.95"/>
  
  <!-- Second smaller burst for depth -->
  <polygon 
    points="200,55 213,100 255,72 234,112 272,108 245,140 278,158 243,166 262,200 228,196 235,232 200,212 165,232 172,196 138,200 157,166 122,158 155,140 128,108 166,112 145,72 187,100"
    fill="#FF7043" opacity="0.5"/>

  <!-- Big O with bandage -->
  <text x="200" y="230" text-anchor="middle" font-size="160" font-family="'Bebas Neue', Arial Black, sans-serif" fill="#1A1A1A" font-weight="900">O</text>
  
  <!-- Bandage body -->
  <rect x="148" y="155" width="104" height="36" rx="10" fill="#F5F5DC"/>
  <!-- Bandage left pad -->
  <rect x="148" y="155" width="30" height="36" rx="10" fill="#E8DCC8"/>
  <!-- Bandage right pad -->
  <rect x="222" y="155" width="30" height="36" rx="10" fill="#E8DCC8"/>
  <!-- Bandage lines -->
  <line x1="158" y1="168" x2="172" y2="168" stroke="#C4A882" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="158" y1="178" x2="172" y2="178" stroke="#C4A882" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="228" y1="168" x2="242" y2="168" stroke="#C4A882" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="228" y1="178" x2="242" y2="178" stroke="#C4A882" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Cross on bandage center -->
  <line x1="200" y1="162" x2="200" y2="184" stroke="#C4A882" stroke-width="2" stroke-linecap="round"/>
  <line x1="189" y1="173" x2="211" y2="173" stroke="#C4A882" stroke-width="2" stroke-linecap="round"/>

  <!-- UCH. text -->
  <text x="200" y="340" text-anchor="middle" font-size="110" font-family="'Bebas Neue', Arial Black, sans-serif" fill="#F5F5F5" letter-spacing="8">UCH.</text>

  <!-- Tagline -->
  <text x="200" y="375" text-anchor="middle" font-size="18" font-family="'Barlow', Arial, sans-serif" fill="#888888" letter-spacing="3">TRASH-TALK ENTRE POTES</text>
</svg>
